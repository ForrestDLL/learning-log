{% extends "learning_logs/base.html" %}
{% block content %}
  <div class="row justify-content-center mt-3">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 card-title mb-3">登录</h1>
          <form action="" method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
              <div class="text-danger small mb-2">{{ form.non_field_errors.0 }}</div>
            {% endif %}
            {% for field in form %}
              <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
              {% endif %}
            {% endfor %}
            <button class="btn btn-primary w-100 mt-3">登录</button>
            <input type="hidden" name="next" value="{{ request.GET.next }}">
          </form>
          <p class="text-secondary small mt-3 mb-0">
            还没有账号？<a href="{% url "users:register" %}">去注册</a>
          </p>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
