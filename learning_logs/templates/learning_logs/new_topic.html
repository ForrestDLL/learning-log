{% extends "learning_logs/base.html" %}
{% block content %}
  <div class="row justify-content-center mt-3">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 card-title mb-3">添加新主题</h1>
          <form action="{% url "learning_logs:new_topic" %}" method="post">
            {% csrf_token %}
            <label for="{{ form.topic_text.id_for_label }}" class="form-label">
              {{ form.topic_text.label }}
            </label>
            {{ form.topic_text }}
            <button class="btn btn-primary w-100 mt-3" name="submit">添加主题</button>
          </form>  
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
