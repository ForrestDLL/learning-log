{% extends "learning_logs/base.html" %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3 mt-3">
    <h1 class="h3 mb-0">全部主题</h1>
    <a class="btn btn-primary btn-sm" href="{% url "learning_logs:new_topic" %}">+ 添加新主题</a>
  </div>

  <ul class="list-group">
    {% for topic in topics %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <a class="text-decoration-none" href="{% url "learning_logs:topic" topic.pk %}">
          {{ topic }}
          <span class="badge text-bg-secondary">{{ topic.entries.count }}</span>
        </a>
        <a class="btn btn-outline-secondary btn-sm" href="{% url "learning_logs:edit_topic" topic.pk %}">编辑</a>
      </li>
    {% empty %}
      <li class="list-group-item text-center text-secondary py-4">
        还没有主题，点右上角添加一个吧！
      </li>
    {% endfor %}
  </ul>
{% endblock content %}
