{% extends "learning_logs/base.html" %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3 mt-3">
    <h1 class="h3 mb-0">{{ topic }}</h1>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-secondary btn-sm" href="{% url "learning_logs:topics" %}">← 全部主题</a>
      <a class="btn btn-primary btn-sm" href="{% url "learning_logs:new_entry" topic.pk %}">+ 添加新条目</a>
    </div>
  </div>

  <ul class="list-group">
    {% for entry in entries %}
      <li class="list-group-item">
        <div class="text-secondary small mb-1">{{ entry.date|date:"Y-m-d, H:i"}}</div>
        <div class="lh-lg">{{ entry.entry_text|linebreaksbr }}</div>
        <a class="btn btn-outline-secondary btn-sm" href="{% url "learning_logs:edit_entry" entry.pk %}">编辑</a>
      </li>
    {% empty %}
      <li class="list-group-item text-center text-secondary py-4">
        本主题还没有创建条目，<a href="{% url "learning_logs:new_entry" topic.pk %}">现在添加一条</a>吧！
      </li>
    {% endfor %}
  </ul>
{% endblock content %}
